location = /gateway/agent-template-pro/chat {
    absolute_redirect off;
    return 308 /gateway/agent-template-pro/chat/;
}

location = /gateway/agent-template-pro/chat/ {
    rewrite ^ /gateway/agent-template-pro/chat/index.html last;
}

location = /gateway/agent-template-pro/chat/index.html {
    alias /home/app/agent-template-pro/current/ui-chat/index.html;
    expires -1;
}

location = /gateway/agent-template-pro/chat/agent-pro-icon.png {
    alias /home/app/agent-template-pro/current/ui-chat/agent-pro-icon.png;
    expires 1y;
}

location ^~ /gateway/agent-template-pro/chat/assets/ {
    alias /home/app/agent-template-pro/current/ui-chat/assets/;
    expires 1y;
}

location ^~ /gateway/agent-template-pro/chat/ {
    rewrite ^ /gateway/agent-template-pro/chat/index.html last;
}

location = /gateway/agent-template-pro/console {
    absolute_redirect off;
    return 308 /gateway/agent-template-pro/console/;
}

location = /gateway/agent-template-pro/console/ {
    rewrite ^ /gateway/agent-template-pro/console/index.html last;
}

location = /gateway/agent-template-pro/console/index.html {
    alias /home/app/agent-template-pro/current/ui-console/index.html;
    expires -1;
}

location = /gateway/agent-template-pro/console/agent-pro-icon.png {
    alias /home/app/agent-template-pro/current/ui-console/agent-pro-icon.png;
    expires 1y;
}

location ^~ /gateway/agent-template-pro/console/assets/ {
    alias /home/app/agent-template-pro/current/ui-console/assets/;
    expires 1y;
}

location ^~ /gateway/agent-template-pro/console/ {
    rewrite ^ /gateway/agent-template-pro/console/index.html last;
}

location ^~ /gateway/agent-template-pro/api/ {
    rewrite ^/gateway/agent-template-pro/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:18400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    client_max_body_size 1m;
}

location = /gateway/agent-template-pro/health {
    proxy_pass http://127.0.0.1:18400/actuator/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    access_log off;
}
