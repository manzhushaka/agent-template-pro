location = /gateway/agent-template-pro/chat {
    return 308 /gateway/agent-template-pro/chat/;
}

location ^~ /gateway/agent-template-pro/chat/ {
    rewrite ^/gateway/agent-template-pro/chat/(.*)$ /$1 break;
    root /home/app/agent-template-pro/current/ui-chat;
    try_files $uri $uri/ /gateway/agent-template-pro/chat/index.html;
    expires -1;
}

location = /gateway/agent-template-pro/console {
    return 308 /gateway/agent-template-pro/console/;
}

location ^~ /gateway/agent-template-pro/console/ {
    rewrite ^/gateway/agent-template-pro/console/(.*)$ /$1 break;
    root /home/app/agent-template-pro/current/ui-console;
    try_files $uri $uri/ /gateway/agent-template-pro/console/index.html;
    expires -1;
}

location ^~ /gateway/agent-template-pro/api/ {
    rewrite ^/gateway/agent-template-pro/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:18400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    client_max_body_size 1m;
}

location = /gateway/agent-template-pro/health {
    proxy_pass http://127.0.0.1:18400/actuator/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    access_log off;
}
